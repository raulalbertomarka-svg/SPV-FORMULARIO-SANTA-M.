<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Relevamiento de stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #24304A;
    --navy-dark: #182238;
    --amber: #D98E2B;
    --amber-dark: #B8741C;
    --paper: #FAFAF8;
    --panel: #FFFFFF;
    --line: #E4E2DC;
    --ink: #22252B;
    --ink-soft: #666A73;
    --good: #2E8B5B;
    --bad: #C0472B;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100vh;
    display:flex;
    flex-direction:column;
  }

  .mono{ font-family: 'IBM Plex Mono', 'Courier New', monospace; }

  button{ font-family: inherit; }

  /* ---------- Pantalla de inicio ---------- */

  .login-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: 32px 24px;
    max-width: 420px;
    margin: 0 auto;
    width:100%;
  }

  .login-mark{
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--navy);
    color: var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono';
    font-weight:600;
    font-size: 15px;
    margin-bottom: 20px;
  }

  .login-screen h1{
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 8px;
    font-weight: 700;
    color: var(--navy-dark);
  }

  .login-screen p.sub{
    margin: 0 0 32px;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.5;
  }

  .field{
    margin-bottom: 18px;
  }

  .field label{
    display:block;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy-dark);
    margin-bottom: 6px;
  }

  .field input{
    width:100%;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 16px;
    background: var(--panel);
    color: var(--ink);
  }

  .field input:focus{
    outline: none;
    border-color: var(--navy);
  }

  .btn-primary{
    width:100%;
    padding: 14px 18px;
    background: var(--navy);
    color: #fff;
    border:none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor:pointer;
    margin-top: 6px;
  }

  .btn-primary:disabled{
    background: #A9AEB8;
    cursor:not-allowed;
  }

  .btn-primary:active:not(:disabled){ background: var(--navy-dark); }

  .form-error{
    color: var(--bad);
    font-size: 13px;
    margin-top: -10px;
    margin-bottom: 14px;
    min-height: 0;
  }

  /* ---------- Pantalla de relevamiento ---------- */

  .app-screen{ display:none; flex:1; flex-direction:column; }
  .app-screen.active{ display:flex; }
  .login-screen.hidden{ display:none; }

  .topbar{
    background: var(--navy);
    color: #fff;
    padding: 14px 18px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    position: sticky;
    top:0;
    z-index: 5;
  }

  .topbar-info{ line-height:1.3; }
  .topbar-info .label{ font-size:11px; color:#B9C2D6; }
  .topbar-info .value{ font-size:14px; font-weight:600; }
  .topbar-info + .topbar-info{ margin-top: 6px; }

  .topbar-change{
    background: none;
    border: 1px solid #47547A;
    color: #E7ECF7;
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor:pointer;
  }

  .search-wrap{
    padding: 14px 18px 10px;
    background: var(--paper);
    position: sticky;
    top: 66px;
    z-index: 4;
    border-bottom: 1px solid var(--line);
  }

  .search-wrap input{
    width:100%;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 16px;
    background: var(--panel);
  }

  .search-wrap input:focus{ outline:none; border-color: var(--navy); }

  .search-hint{
    font-size: 12px;
    color: var(--ink-soft);
    margin: 8px 2px 0;
  }

  .content{ flex:1; padding: 0 18px 140px; max-width: 640px; margin:0 auto; width:100%; }

  .section-title{
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 18px 2px 8px;
  }

  .results-list{ display:flex; flex-direction:column; gap:8px; }

  .product-row{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    cursor:pointer;
  }

  .product-row:active{ border-color: var(--navy); }

  .product-row .pcode{ font-size: 13px; color: var(--ink-soft); }
  .product-row .pdesc{ font-size: 15px; font-weight:500; margin-top: 2px; }
  .product-row .padd{
    font-size: 13px;
    font-weight:600;
    color: var(--navy);
    white-space: nowrap;
    margin-left: 12px;
  }

  .empty-note{
    color: var(--ink-soft);
    font-size: 14px;
    padding: 18px 2px;
    line-height:1.5;
  }

  .cart-row{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    gap: 10px;
  }

  .cart-row + .cart-row{ margin-top: 8px; }

  .cart-row .info{ min-width:0; }
  .cart-row .pdesc{ font-size:14px; font-weight:500; }
  .cart-row .pcode{ font-size:12px; color: var(--ink-soft); }

  .cart-row .qty{
    font-family:'IBM Plex Mono';
    font-weight:600;
    font-size: 15px;
    background: #F0EEE7;
    padding: 5px 10px;
    border-radius: 6px;
    white-space:nowrap;
  }

  .cart-row .remove{
    background:none;
    border:none;
    color: var(--bad);
    font-size: 13px;
    cursor:pointer;
    padding: 4px 6px;
  }

  .bottom-bar{
    position: fixed;
    bottom:0; left:0; right:0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
    box-shadow: 0 -6px 16px rgba(0,0,0,0.05);
  }

  .bottom-bar-inner{ max-width: 640px; margin:0 auto; }

  .bottom-count{
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    text-align:center;
  }

  .btn-submit{
    width:100%;
    padding: 15px 18px;
    background: var(--amber);
    color: #2A1B02;
    border:none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor:pointer;
  }

  .btn-submit:disabled{ background:#DCD3C2; color:#8B8577; cursor:not-allowed; }
  .btn-submit:active:not(:disabled){ background: var(--amber-dark); }

  /* ---------- Modal de cantidad ---------- */

  .modal-backdrop{
    position: fixed; inset:0;
    background: rgba(24,34,56,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index: 20;
  }
  .modal-backdrop.active{ display:flex; }

  .modal{
    background: var(--panel);
    width:100%;
    max-width: 480px;
    border-radius: 16px 16px 0 0;
    padding: 22px 22px calc(22px + env(safe-area-inset-bottom));
  }

  .modal .pcode{ font-size: 13px; color: var(--ink-soft); }
  .modal .pdesc{ font-size: 18px; font-weight:600; margin: 4px 0 20px; }

  .qty-control{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin-bottom: 22px;
  }

  .qty-btn{
    width: 48px; height: 48px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    font-size: 22px;
    font-weight:600;
    color: var(--navy-dark);
    cursor:pointer;
  }

  .qty-value{
    font-family:'IBM Plex Mono';
    font-size: 28px;
    font-weight: 600;
    min-width: 70px;
    text-align:center;
  }

  .modal-actions{ display:flex; gap:10px; }

  .btn-secondary{
    flex:1;
    padding: 13px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    font-weight:600;
    color: var(--ink);
    cursor:pointer;
  }

  .modal .btn-primary{ flex:1.4; margin-top:0; }

  /* ---------- Toast ---------- */

  .toast{
    position: fixed;
    top: 16px; left:50%;
    transform: translateX(-50%);
    background: var(--navy-dark);
    color:#fff;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 30;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease, top 0.25s ease;
    max-width: 90%;
    text-align:center;
  }
  .toast.show{ opacity:1; top: 20px; }
  .toast.error{ background: var(--bad); }
  .toast.success{ background: var(--good); }

</style>
</head>
<body>

  <!-- PANTALLA 1: datos del auditor -->
  <div class="login-screen" id="loginScreen">
    <div class="login-mark">R</div>
    <h1>Relevamiento de stock</h1>
    <p class="sub">Ingresá tu nombre y la sucursal que vas a relevar para empezar.</p>

    <div class="field">
      <label for="inputSupervisor">Tu nombre</label>
      <input type="text" id="inputSupervisor" placeholder="Nombre y apellido" autocomplete="name">
    </div>

    <div class="field">
      <label for="inputSucursal">Sucursal que relevás</label>
      <input type="text" id="inputSucursal" placeholder="Ej: Local Centro" autocomplete="off">
    </div>

    <div class="form-error" id="loginError"></div>

    <button class="btn-primary" id="btnStart">Comenzar relevamiento</button>
  </div>

  <!-- PANTALLA 2: búsqueda y carga -->
  <div class="app-screen" id="appScreen">
    <div class="topbar">
      <div>
        <div class="topbar-info">
          <div class="label">Sucursal</div>
          <div class="value" id="topSucursal">—</div>
        </div>
        <div class="topbar-info">
          <div class="label">Relevado por</div>
          <div class="value" id="topSupervisor">—</div>
        </div>
      </div>
      <button class="topbar-change" id="btnChange">Cambiar</button>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar por código de barra o nombre" inputmode="search">
      <div class="search-hint" id="searchHint"></div>
    </div>

    <div class="content">
      <div class="section-title">Resultados</div>
      <div class="results-list" id="resultsList"></div>

      <div class="section-title" id="cartTitle" style="display:none;">Relevado en esta sesión</div>
      <div id="cartList"></div>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar" style="display:none;">
    <div class="bottom-bar-inner">
      <div class="bottom-count" id="bottomCount">0 productos cargados</div>
      <button class="btn-submit" id="btnSubmit">Enviar relevamiento</button>
    </div>
  </div>

  <!-- Modal cantidad -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="pcode" id="modalCode"></div>
      <div class="pdesc" id="modalDesc"></div>

      <div class="qty-control">
        <button class="qty-btn" id="qtyMinus">−</button>
        <div class="qty-value" id="qtyValue">1</div>
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancelQty">Cancelar</button>
        <button class="btn-primary" id="btnConfirmQty">Agregar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ---------- CONFIGURACIÓN ----------
  // URL del script de Google Apps Script (Implementar > Aplicación web).
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQGNf729keB3J2J0vlqsHVLogX_0xh6eZkwsefQXQ4keZ2x_DIZl95HiBjx0tyILHZ/exec";

  // ---------- ESTADO ----------
  var productos = [];        // catálogo completo {codigo, descripcion}
  var carrito = [];          // items relevados {codigo, descripcion, cantidad}
  var supervisor = "";
  var sucursal = "";
  var productoSeleccionado = null;
  var qtyActual = 1;

  // ---------- ELEMENTOS ----------
  var loginScreen = document.getElementById('loginScreen');
  var appScreen = document.getElementById('appScreen');
  var inputSupervisor = document.getElementById('inputSupervisor');
  var inputSucursal = document.getElementById('inputSucursal');
  var loginError = document.getElementById('loginError');
  var btnStart = document.getElementById('btnStart');
  var topSucursal = document.getElementById('topSucursal');
  var topSupervisor = document.getElementById('topSupervisor');
  var btnChange = document.getElementById('btnChange');
  var searchInput = document.getElementById('searchInput');
  var searchHint = document.getElementById('searchHint');
  var resultsList = document.getElementById('resultsList');
  var cartTitle = document.getElementById('cartTitle');
  var cartList = document.getElementById('cartList');
  var bottomBar = document.getElementById('bottomBar');
  var bottomCount = document.getElementById('bottomCount');
  var btnSubmit = document.getElementById('btnSubmit');
  var modalBackdrop = document.getElementById('modalBackdrop');
  var modalCode = document.getElementById('modalCode');
  var modalDesc = document.getElementById('modalDesc');
  var qtyValue = document.getElementById('qtyValue');
  var qtyMinus = document.getElementById('qtyMinus');
  var qtyPlus = document.getElementById('qtyPlus');
  var btnCancelQty = document.getElementById('btnCancelQty');
  var btnConfirmQty = document.getElementById('btnConfirmQty');
  var toast = document.getElementById('toast');

  // ---------- INICIO ----------
  window.addEventListener('DOMContentLoaded', function(){
    var savedSup = localStorage.getItem('relevamiento_supervisor');
    var savedSuc = localStorage.getItem('relevamiento_sucursal');
    if(savedSup) inputSupervisor.value = savedSup;
    if(savedSuc) inputSucursal.value = savedSuc;
    cargarProductos();
  });

  function cargarProductos(){
    searchHint.textContent = "Cargando catálogo...";
    fetch(SCRIPT_URL + "?action=getProductos")
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.error){
          searchHint.textContent = "No se pudo cargar el catálogo: " + data.error;
          return;
        }
        productos = data;
        searchHint.textContent = productos.length + " productos disponibles en el catálogo";
      })
      .catch(function(err){
        searchHint.textContent = "No se pudo conectar con la planilla. Revisá tu conexión.";
      });
  }

  // ---------- LOGIN ----------
  btnStart.addEventListener('click', function(){
    var sup = inputSupervisor.value.trim();
    var suc = inputSucursal.value.trim();

    if(!sup || !suc){
      loginError.textContent = "Completá tu nombre y la sucursal para continuar.";
      return;
    }
    loginError.textContent = "";

    supervisor = sup;
    sucursal = suc;
    localStorage.setItem('relevamiento_supervisor', sup);
    localStorage.setItem('relevamiento_sucursal', suc);

    topSupervisor.textContent = supervisor;
    topSucursal.textContent = sucursal;

    loginScreen.classList.add('hidden');
    appScreen.classList.add('active');
    searchInput.focus();
  });

  btnChange.addEventListener('click', function(){
    if(carrito.length > 0){
      var ok = confirm("Tenés " + carrito.length + " producto(s) sin enviar. Si cambiás de sucursal se van a perder. ¿Continuar?");
      if(!ok) return;
    }
    carrito = [];
    renderCarrito();
    appScreen.classList.remove('active');
    loginScreen.classList.remove('hidden');
  });

  // ---------- BÚSQUEDA ----------
  searchInput.addEventListener('input', function(){
    renderResultados(searchInput.value.trim().toLowerCase());
  });

  function renderResultados(query){
    resultsList.innerHTML = "";

    if(!query){
      return;
    }

    var coincidencias = productos.filter(function(p){
      return p.codigo.toLowerCase().indexOf(query) !== -1 ||
             p.descripcion.toLowerCase().indexOf(query) !== -1;
    }).slice(0, 30);

    if(coincidencias.length === 0){
      resultsList.innerHTML = '<div class="empty-note">No se encontraron productos con "' + escapeHtml(query) + '".</div>';
      return;
    }

    coincidencias.forEach(function(p){
      var row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML =
        '<div>' +
          '<div class="pcode mono">' + escapeHtml(p.codigo) + '</div>' +
          '<div class="pdesc">' + escapeHtml(p.descripcion) + '</div>' +
        '</div>' +
        '<div class="padd">Agregar</div>';
      row.addEventListener('click', function(){ abrirModalCantidad(p); });
      resultsList.appendChild(row);
    });
  }

  // ---------- MODAL CANTIDAD ----------
  function abrirModalCantidad(producto){
    productoSeleccionado = producto;
    var existente = carrito.find(function(i){ return i.codigo === producto.codigo; });
    qtyActual = existente ? existente.cantidad : 1;

    modalCode.textContent = producto.codigo;
    modalDesc.textContent = producto.descripcion;
    qtyValue.textContent = qtyActual;
    modalBackdrop.classList.add('active');
  }

  function cerrarModal(){
    modalBackdrop.classList.remove('active');
    productoSeleccionado = null;
  }

  qtyMinus.addEventListener('click', function(){
    if(qtyActual > 1) qtyActual--;
    qtyValue.textContent = qtyActual;
  });

  qtyPlus.addEventListener('click', function(){
    qtyActual++;
    qtyValue.textContent = qtyActual;
  });

  btnCancelQty.addEventListener('click', cerrarModal);

  btnConfirmQty.addEventListener('click', function(){
    if(!productoSeleccionado) return;

    var existente = carrito.find(function(i){ return i.codigo === productoSeleccionado.codigo; });
    if(existente){
      existente.cantidad = qtyActual;
    } else {
      carrito.push({
        codigo: productoSeleccionado.codigo,
        descripcion: productoSeleccionado.descripcion,
        cantidad: qtyActual
      });
    }

    renderCarrito();
    mostrarToast(productoSeleccionado.descripcion + " agregado", "success");
    cerrarModal();
    searchInput.value = "";
    resultsList.innerHTML = "";
    searchInput.focus();
  });

  // ---------- CARRITO ----------
  function renderCarrito(){
    cartList.innerHTML = "";

    if(carrito.length === 0){
      cartTitle.style.display = 'none';
      bottomBar.style.display = 'none';
      return;
    }

    cartTitle.style.display = 'block';
    bottomBar.style.display = 'block';
    bottomCount.textContent = carrito.length + (carrito.length === 1 ? " producto cargado" : " productos cargados");

    carrito.forEach(function(item, idx){
      var row = document.createElement('div');
      row.className = 'cart-row';
      row.innerHTML =
        '<div class="info">' +
          '<div class="pdesc">' + escapeHtml(item.descripcion) + '</div>' +
          '<div class="pcode mono">' + escapeHtml(item.codigo) + '</div>' +
        '</div>' +
        '<div class="qty mono">' + item.cantidad + '</div>' +
        '<button class="remove" data-idx="' + idx + '">Quitar</button>';
      cartList.appendChild(row);
    });

    Array.prototype.forEach.call(cartList.querySelectorAll('.remove'), function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        carrito.splice(idx, 1);
        renderCarrito();
      });
    });
  }

  // ---------- ENVÍO ----------
  btnSubmit.addEventListener('click', function(){
    if(carrito.length === 0) return;

    btnSubmit.disabled = true;
    btnSubmit.textContent = "Enviando...";

    var payload = {
      supervisor: supervisor,
      sucursal: sucursal,
      items: carrito
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.success){
          mostrarToast("Relevamiento enviado (" + data.filasAgregadas + " productos)", "success");
          carrito = [];
          renderCarrito();
        } else {
          mostrarToast("Error al enviar: " + (data.error || "desconocido"), "error");
        }
      })
      .catch(function(err){
        mostrarToast("No se pudo enviar. Revisá tu conexión e intentá de nuevo.", "error");
      })
      .finally(function(){
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Enviar relevamiento";
      });
  });

  // ---------- UTILIDADES ----------
  function mostrarToast(msg, tipo){
    toast.textContent = msg;
    toast.className = 'toast show' + (tipo ? ' ' + tipo : '');
    setTimeout(function(){ toast.className = 'toast'; }, 3000);
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
